services:
  mysql:
    image: mysql:8.0
    container_name: zenix_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zenix_homologacao
      MYSQL_USER: zenix_user
      MYSQL_PASSWORD: Zenix_User
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - zenix_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 20s
      retries: 10

  app:
    build: ./zenix_app
    container_name: zenixapp
    expose:
      - "9090"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - zenix_net

  frontend:
    build: ./zenixapp-frontend
    container_name: zenix_frontend
    ports:
      - "4200:80"
    depends_on:
      - app
    networks:
      - zenix_net

volumes:
  mysql_data:

networks:
  zenix_net:

services:
  mysql:
    image: mysql:8.0
    container_name: zenix_db
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE}
      MYSQL_USER: ${USER}
      MYSQL_PASSWORD: ${PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - zenix_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 20s
      retries: 10

  app:
    build: ./zenix_app
    container_name: zenixapp
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql/${DATABASE}
      SPRING_DATASOURCE_USERNAME: ${USER}
      SPRING_DATASOURCE_PASSWORD: ${PASSWORD}
      SPRING_PROFILES_ACTIVE: dev
      API_SECURITY_TOKEN_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - zenix_net

  frontend:
    build: ./zenixapp_frontend
    container_name: zenix_frontend
    ports:
      - "5173:80"
    depends_on:
      - app
    networks:
      - zenix_net

volumes:
  mysql_data:

networks:
  zenix_net:

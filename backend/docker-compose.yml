version: "3"

services:
  db:
    image: mysql:9.6-oracle
    container_name: mysql
    volumes:
      - db_data_zenixapp:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: zenixapp
      MYSQL_DATABASE: zenix_db
      MYSQL_USER: zenix_user
      MYSQL_PASSWORD: Zenix_User
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - zenix_app

  app:
    container_name: zenixapp-server
    build:
      dockerfile: Dockerfile
    image: zenixapp-server:1.0.0
    ports:
      - "8080:9090"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zenix_app


volumes:
  db_data_zenixapp:

networks:
  zenix_app:

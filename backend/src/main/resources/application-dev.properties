spring.application.name=zenix
server.port=9090
api.security.secret={SECURITY_KEY}

# Banco de Dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Tracing (Spring Boot / Micrometer) ? usa variável de ambiente OTEL_EXPORTER_OTLP_ENDPOINT
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces

# Métricas OTLP
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
management.otlp.metrics.export.step=10s

# Logs OTLP
management.otlp.logging.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/logs

# OTel Autoconfigure ? sobrescrito pelas variáveis de ambiente do docker-compose
# OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_PROTOCOL e OTEL_SERVICE_NAME
# são injetados via environment: no docker-compose.yml
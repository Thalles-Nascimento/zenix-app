server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redireciona todas as rotas para o index.html — React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o backend — evita CORS
    location /api/ {
        proxy_pass http://zenixapp:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
    }

    # Proxy para o OTel Collector — frontend envia traces pelo Nginx
    # Isso resolve o problema do VITE_OTEL_URL em produção:
    # o browser envia para /otel/v1/traces (relativo) e o Nginx redireciona
    location /otel/ {
        proxy_pass http://otel-collector:4318/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # CORS para o browser conseguir enviar traces
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, traceparent, tracestate" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}